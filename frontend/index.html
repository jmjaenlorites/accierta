<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6C5CE7" />
    <title>Accierta — Apuestas entre amigos con puntos ficticios</title>
    <meta name="description" content="Accierta es la app gratuita para hacer apuestas con amigos usando puntos ficticios. Crea predicciones sobre cualquier cosa, compite en el ranking de tu grupo y diviértete sin dinero real." />
    <link rel="canonical" href="https://accierta.com/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Accierta — Apuestas entre amigos sin dinero real" />
    <meta property="og:description" content="Crea predicciones sobre cualquier cosa, apuesta puntos ficticios y compite en el ranking de tu grupo." />
    <meta property="og:url" content="https://accierta.com/" />
    <meta property="og:image" content="https://accierta.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Accierta" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Accierta — Apuestas entre amigos sin dinero real" />
    <meta name="twitter:description" content="Crea predicciones sobre cualquier cosa, apuesta puntos ficticios y compite en el ranking de tu grupo." />
    <meta name="twitter:image" content="https://accierta.com/og-image.png" />

    <!-- Language alternatives -->
    <link rel="alternate" hreflang="es" href="https://accierta.com/landing" />
    <link rel="alternate" hreflang="en" href="https://accierta.com/landing?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://accierta.com/landing" />

    <!-- Structured data: App -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Accierta",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "description": "App gratuita para hacer apuestas entre amigos con puntos ficticios. Crea predicciones, apuesta puntos y compite en el ranking de tu grupo.",
      "url": "https://accierta.com",
      "inLanguage": ["es", "en"]
    }
    </script>

    <!-- Structured data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Se apuesta dinero real en Accierta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Se apuestan puntos ficticios. Cada grupo elige su moneda simbólica (euros ficticios, cervezas, etc). Si tu grupo quiere gestionar dinero real, lo hacéis fuera de la app."
          }
        },
        {
          "@type": "Question",
          "name": "¿Es gratis Accierta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, totalmente gratis. Sin planes de pago, sin funciones premium, sin publicidad."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se resuelven las apuestas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cualquier miembro puede proponer el resultado. Si hay desacuerdo, se vota. El consenso del grupo decide."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo tener varios grupos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Puedes estar en tantos grupos como quieras, cada uno con su propio ranking y moneda."
          }
        }
      ]
    }
    </script>

    <!-- Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
