name: Deploy Backend

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'Dockerfile'
              - 'gradle/**'
              - 'gradlew'

  deploy:
    name: Trigger Coolify Deployment
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment in Coolify
        if: github.ref_name == 'main'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_PROD }}
        run: |
          test -n "$COOLIFY_WEBHOOK_URL"
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK_URL"

      - name: Trigger staging deployment in Coolify
        if: github.ref_name == 'staging'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_STAGING }}
        run: |
          test -n "$COOLIFY_WEBHOOK_URL"
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK_URL"
