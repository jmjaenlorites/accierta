name: Deploy Frontend

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

  deploy:
    name: Deploy Frontend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        if: github.ref_name == 'main'
        env:
          VITE_API_BASE_URL: https://api.accierta.com
          VITE_WS_BASE_URL: wss://api.accierta.com/ws
        run: npm run build

      - name: Build staging frontend
        if: github.ref_name == 'staging'
        env:
          VITE_API_BASE_URL: https://api-staging.accierta.com
          VITE_WS_BASE_URL: wss://api-staging.accierta.com/ws
        run: npm run build

      - name: Deploy production frontend to Cloudflare Pages
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_PROD }}
            --branch=main

      - name: Deploy staging frontend to Cloudflare Pages
        if: github.ref_name == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }}
            --branch=staging
