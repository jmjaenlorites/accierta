spring:
  application:
    name: accierta
  sql:
    init:
      mode: always

server:
  port: 8080
  forward-headers-strategy: framework

accierta:
  security:
    jwt-secret: ${ACCIERTA_SECURITY_JWT_SECRET:change-me-in-real-env-this-secret-must-be-at-least-32-bytes}
  web:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
  groups:
    invitation-base-url: ${ACCIERTA_GROUPS_INVITATION_BASE_URL:http://localhost:3000/invite}
  betting:
    lifecycle:
      enabled: true
      fixed-delay-ms: 10000
  resolution:
    auto-accept:
      enabled: true
      fixed-delay-ms: 10000
