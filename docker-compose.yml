services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accierta
      SPRING_DATASOURCE_USERNAME: accierta
      SPRING_DATASOURCE_PASSWORD: accierta
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accierta
      POSTGRES_USER: accierta
      POSTGRES_PASSWORD: accierta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accierta -d accierta"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
